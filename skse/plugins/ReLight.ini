;allow relight to disable all non relight lights(except those whos editor id in exclude section below)
disableGameLights=false

; enable light flicker prevention (Not for CS users)
enableLightFlickerPrevention=false

;Change brightness of all Relight lights
lightBrightnessMultiplier=1

;Change brightness of all non SKSE lights
nonSKSELightsBrightnessMultiplier=1

; remove fake glow orbs (default = true)
removeFakeGlowOrbs=true

; enable debug bulbs (default = false)
enableDebugBulbs=false

; enable debug lines (default = true)
enableDebugLines=true

; max distance for debug lines (default = false)
maxDistanceForDrawDebuglines=500

; Make all Relights have Inverse Squared Lighting regardless of ISL flag
allRelightsAsISL=true

; Logging Level (0: critical, 1: warnings/errors, 2: info, 3: debug)
loggingLevel=1

; Light merge settings

enableLightMerging=true
light merge distance=130.75
enableShadowLightMerging=true
shadow light merge distance=162
light merge distance increased=189
max z diff to merge=28.7
max z diff to merge increased=160.7
light fade increase per merge=0.225
light radius increase per merge=0.225
light fade max=1.75
light radius max=1.75
light merge max lights=12


;Light FlickerPrevention Settings

;trishapes with worldbound radius larger than this number will not participate in light flicker prevention
large surface size=1800
;trishapes with worldbound radius larger then this number will not participate in light type distance checks
medium surface size=700
;trishapes with worldbound radius larger then this number will not participate in max light types per surface checks
small surface size=350
max candles per sm surface=4
max chandeliers per sm surface=3
max fires per sm surface=4
max candles per m surface=6
max chandeliers per m surface=3
max fires per m surface=4
max candle distance=470
max candle z distance=200
max chandelier distance=630
max chandelier z distance=350

; add esps by name to have relight not disable their lights (usually not needed)
whitelist=evgsirenroot,BluePalaceDomeLight

